name: CI

on:
  push:
    branches: ['**']
  pull_request:

# No secrets are needed for any job here. The AI integration is optional and is
# never exercised in CI.
permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The toolkit must work for authors on all three platforms, so it is
        # tested on all three. Launching the game remains Windows-only; nothing
        # in CI attempts it.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke-test the CLI
        shell: bash
        run: |
          node packages/cli/dist/bin.js --help
          node packages/cli/dist/bin.js registry validate

          # `sah doctor` exits non-zero when something needs the user's
          # attention, and on a fresh clone Game.lua has deliberately not been
          # fetched into the git-ignored vendor/ directory. So assert that
          # doctor produces a usable report — not that this runner happens to
          # be a fully provisioned authoring environment.
          doctor_json=$(node packages/cli/dist/bin.js doctor --json || true)
          printf '%s' "$doctor_json" | node -e '
            const report = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            if (!Array.isArray(report.checks) || report.checks.length === 0) {
              throw new Error("doctor reported no checks");
            }
            if (/sk-ant-/.test(JSON.stringify(report))) {
              throw new Error("doctor leaked something key-shaped");
            }
            console.log(`doctor reported ${report.checks.length} checks on ${report.platform.platform}`);
          '

      - name: Lua definitions are current
        shell: bash
        run: |
          node packages/cli/dist/bin.js lua-defs generate --check
          node packages/cli/dist/bin.js lua-defs check

      - name: The minimal campaign must build
        shell: bash
        run: node packages/cli/dist/bin.js build examples/minimal-campaign --dry-run

      - name: Pocket tools work on this platform
        shell: bash
        run: |
          # Exercised against a throwaway fixture on every OS, because these
          # tools are all about path handling and that is exactly what differs
          # between macOS, Windows and Linux.
          set -euo pipefail
          work="$(mktemp -d)"
          mkdir -p "$work/mod/Resources/scripts"
          printf '[Miscellaneous]\nTitle=CI Fixture\n' > "$work/mod/Meta.ini"
          printf 'Game.SelectMission("m0")\n' > "$work/mod/Resources/scripts/m0i.lua"
          printf 'junk' > "$work/mod/.DS_Store"

          node packages/cli/dist/bin.js pocket case-check "$work/mod"
          node packages/cli/dist/bin.js pocket path "$work/mod" Resources/scripts/m0i.lua --form ini

          # A manifest must be byte-identical across runs on every platform.
          node packages/cli/dist/bin.js pocket manifest "$work/mod" > "$work/first.json"
          node packages/cli/dist/bin.js pocket manifest "$work/mod" > "$work/second.json"
          if ! cmp -s "$work/first.json" "$work/second.json"; then
            echo "::error::pocket manifest is not deterministic on ${{ matrix.os }}"
            exit 1
          fi

          # clean-export must leave the original alone and drop the junk.
          node packages/cli/dist/bin.js pocket clean-export "$work/mod" "$work/export"
          test -f "$work/mod/.DS_Store" || { echo "::error::clean-export modified the source"; exit 1; }
          test ! -e "$work/export/.DS_Store" || { echo "::error::junk was exported"; exit 1; }

          # diff must report no differences as exit 0, differences as exit 1.
          node packages/cli/dist/bin.js pocket diff "$work/mod" "$work/mod"
          printf 'changed' > "$work/export/new.txt"
          if node packages/cli/dist/bin.js pocket diff "$work/mod" "$work/export"; then
            echo "::error::pocket diff reported no differences between different folders"
            exit 1
          fi
          echo "Pocket tools behaved correctly on ${{ matrix.os }}."

      - name: The Springfield After Hours example must NOT build
        shell: bash
        run: |
          # This example references unverified game content on purpose. If it
          # ever starts validating, either the registry gained records without
          # provenance or the verification gate stopped working. Both are
          # regressions worth failing the build over.
          if node packages/cli/dist/bin.js validate examples/springfield-after-hours; then
            echo "::error::examples/springfield-after-hours validated, but it is expected to fail with unresolved references."
            exit 1
          fi
          echo "Correctly refused, as designed."

  registries:
    name: Registries are derived, not hand-edited
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Verify pinned upstream files
        run: |
          node scripts/upstream/fetch-upstream.mjs
          node scripts/upstream/fetch-upstream.mjs --verify

      - name: Command registry matches upstream Game.lua
        run: node scripts/research/derive-command-registry.mjs --check

      - name: Build (needed for the sah CLI)
        run: npm run build

      - name: Lua definitions cover the registry and have not drifted
        run: node packages/cli/dist/bin.js lua-defs check

  hygiene:
    name: No secrets or game assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse committed secrets
        run: |
          # Deliberately narrow: real credential shapes only, so this does not
          # fire on documentation that merely mentions the variable name.
          if git grep -nIE '(sk-ant-[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ':!*.lock' ':!package-lock.json'; then
            echo "::error::A credential-shaped string is committed."
            exit 1
          fi
          echo "No credential-shaped strings found."

      - name: Refuse committed game assets
        run: |
          # This repository must never contain game or third-party mod assets.
          matches=$(git ls-files | grep -iE '\.(p3d|rcf|rsd|bik|spt|exe|dll)$' || true)
          if [ -n "$matches" ]; then
            echo "::error::Game asset file types are committed:"
            echo "$matches"
            exit 1
          fi
          echo "No game asset file types found."

      - name: Refuse vendored upstream code
        run: |
          # Upstream Lua is fetched into git-ignored vendor/, never committed.
          if git ls-files | grep -q '^vendor/'; then
            echo "::error::vendor/ must not be committed; it is fetched on demand."
            exit 1
          fi
          echo "No vendored upstream code found."
