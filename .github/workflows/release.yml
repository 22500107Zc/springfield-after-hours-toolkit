name: Release

# Manual only. Nothing here ever runs on a push, a pull request or a schedule —
# publishing is always a deliberate human act.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create, e.g. v0.1.1'
        required: true
        default: 'v0.1.1'
      commit:
        description: 'Full 40-character commit SHA to release. Must already be on main.'
        required: true
      title:
        description: 'Release title'
        required: true
        default: 'Springfield After Hours Toolkit 0.1.1'

# The only permission this workflow needs is the ability to write a tag and a
# release. It uses the automatically-provided GITHUB_TOKEN — there is no
# personal access token, and no repository secret, anywhere in this file.
permissions:
  contents: read

jobs:
  # --- gate ------------------------------------------------------------------
  # Every refusal happens here, before any machine spends time building.

  check:
    name: Validate the request
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.notes.outputs.path }}
    steps:
      - name: Validate the version and commit format
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          commit='${{ inputs.commit }}'

          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::\"$version\" is not a vX.Y.Z version tag."
            exit 1
          fi
          if ! printf '%s' "$commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::\"$commit\" is not a full 40-character commit SHA."
            echo "::error::Release a specific verified commit, not a branch name."
            exit 1
          fi
          echo "Request is well formed."

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - name: The commit must already be on main
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor '${{ inputs.commit }}' FETCH_HEAD; then
            echo "::error::${{ inputs.commit }} is not an ancestor of main."
            echo "::error::Only commits that have been reviewed and merged can be released."
            exit 1
          fi

      - name: The version in package.json must match the tag
        run: |
          set -euo pipefail
          declared=$(node -p "require('./package.json').version")
          expected='${{ inputs.version }}'
          if [ "v$declared" != "$expected" ]; then
            echo "::error::package.json says $declared but you asked to release $expected."
            echo "::error::A binary that misreports its own version is worse than no binary."
            exit 1
          fi
          echo "package.json declares $declared."

      - name: Release notes must exist on the product commit
        id: notes
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          notes="docs/releases/${version#v}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Expected release notes at $notes on the released commit."
            exit 1
          fi
          echo "path=$notes" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing tag or release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin 'refs/tags/${{ inputs.version }}' >/dev/null 2>&1; then
            echo "::error::Tag ${{ inputs.version }} already exists. Refusing to move or replace it."
            exit 1
          fi
          if gh release view '${{ inputs.version }}' --repo '${{ github.repository }}' >/dev/null 2>&1; then
            echo "::error::A release for ${{ inputs.version }} already exists."
            exit 1
          fi

  # --- full test suite -------------------------------------------------------

  test:
    name: Test (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check

  # --- one native runner per download ----------------------------------------
  #
  # Each artifact is built AND smoke-tested on the operating system and
  # architecture it targets. Cross-compiling all four on one machine would be
  # faster and would prove nothing: a binary nobody has executed is not a
  # verified binary.
  #
  # macos-14 and later are Apple Silicon; macos-13 is the last Intel image
  # GitHub provides. If GitHub retires macos-13, the Intel download must be
  # marked unavailable rather than cross-built and described as tested.

  build:
    name: Build ${{ matrix.target }}
    needs: [check, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-apple-silicon
            runner: macos-14
          - target: macos-intel
            runner: macos-13
          - target: windows-x64
            runner: windows-latest
          - target: linux-x64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Bundle and build the executable
        run: |
          npm run dist:bundle
          node scripts/packaging/build-binaries.mjs --only ${{ matrix.target }}

      - name: Smoke-test the executable on its own platform
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "windows-x64" ]; then
            exe="dist-bundle/binaries/${{ matrix.target }}/sah.exe"
          else
            exe="dist-bundle/binaries/${{ matrix.target }}/sah"
          fi

          # It must report the version it actually is.
          version=$("$exe" --version)
          expected="${{ inputs.version }}"
          if [ "v$version" != "$expected" ]; then
            echo "::error::binary reports $version, expected ${expected#v}"
            exit 1
          fi

          # It must work with no repository around it: the registries and the
          # editor definitions are embedded, and this is where that is proven.
          "$exe" help > /dev/null
          "$exe" registry list levels | grep -q level01
          "$exe" definitions check > /dev/null

          # And it must be able to do the thing a beginner downloaded it for.
          work="$(mktemp -d)"
          "$exe" start --name "CI Smoke" --author "CI" --to "$work/mod" --yes > /dev/null
          test -f "$work/mod/Meta.ini"
          test -f "$work/mod/Resources/lib/external/sah-game-lua-definitions/Game.meta.lua"

          # Creating over an existing folder must be refused, not forced.
          if "$exe" start --name "CI Smoke" --author "CI" --to "$work/mod" --yes > /dev/null 2>&1; then
            echo "::error::the wizard overwrote an existing folder"
            exit 1
          fi
          echo "${{ matrix.target }} verified on ${{ matrix.runner }}."

      - name: Make and verify the archive
        shell: bash
        run: |
          node scripts/packaging/make-archives.mjs --only ${{ matrix.target }}
          node scripts/packaging/verify-archives.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist-bundle/archives/*
          if-no-files-found: error
          retention-days: 1

  # --- publish ---------------------------------------------------------------

  publish:
    name: Publish ${{ inputs.version }}
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: incoming
          pattern: archive-*
          merge-multiple: true

      - name: Collect the release files
        run: |
          set -euo pipefail
          mkdir -p release
          cp incoming/* release/
          cp packages/game-lua-definitions/generated/Game.meta.lua release/
          cp docs/releases/artifacts/Game.meta.lua.README.md release/

          # Every supported download must be present. A partial release is
          # worse than a late one: it silently strands whichever platform is
          # missing.
          for target in macos-apple-silicon macos-intel linux-x64; do
            ls release/sah-*-"$target".tar.gz >/dev/null
          done
          ls release/sah-*-windows-x64.zip >/dev/null

          ls -la release/

      - name: Generate checksums
        run: |
          set -euo pipefail
          # Computed here, over the exact bytes being uploaded — never copied
          # from an earlier run or from notes.
          cd release && sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "### Artifact checksums"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the annotated tag
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a '${{ inputs.version }}' '${{ inputs.commit }}' -m '${{ inputs.title }}'
          git push origin 'refs/tags/${{ inputs.version }}'

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create '${{ inputs.version }}' \
            --repo '${{ github.repository }}' \
            --target '${{ inputs.commit }}' \
            --title '${{ inputs.title }}' \
            --notes-file '${{ needs.check.outputs.notes }}' \
            --verify-tag \
            release/*

      - name: Verify what was published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view '${{ inputs.version }}' --repo '${{ github.repository }}' \
            --json tagName,name,isDraft,targetCommitish,assets

          tagged=$(gh api "repos/${{ github.repository }}/git/refs/tags/${{ inputs.version }}" --jq '.object.sha')
          target=$(gh api "repos/${{ github.repository }}/git/tags/$tagged" --jq '.object.sha' 2>/dev/null || printf '%s' "$tagged")
          if [ "$target" != '${{ inputs.commit }}' ]; then
            echo "::error::Tag resolves to $target, expected ${{ inputs.commit }}."
            exit 1
          fi

          for asset in Game.meta.lua Game.meta.lua.README.md SHA256SUMS.txt; do
            gh release view '${{ inputs.version }}' --repo '${{ github.repository }}' \
              --json assets --jq '.assets[].name' | grep -qx "$asset"
          done
          echo "Published and verified."
