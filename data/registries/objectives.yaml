version: 1
registry: objectives
description: >-
  Mission objective types. The NAMES below are verified from Donut Team's
  published objective lists. Their PARAMETERS mostly are not: at the time of
  writing, most individual objective pages upstream read only "TODO". Each
  record therefore carries a separate `compilerSupport` field stating whether
  this toolkit can actually emit it, which is a stricter claim than "it exists".

records:
  # ---------------------------------------------------------------------------
  # Base game objectives. Source: DT Docs "All Objectives".
  # ---------------------------------------------------------------------------
  - id: dummy
    displayName: dummy
    gameCode: dummy
    category: base-game
    providedBy: base-game
    verificationStatus: verified
    verifiedAt: '2026-08-05'
    compilerSupport: supported
    parameters: []
    tags: [objective, no-op, compiler-safe]
    provenance:
      sources:
        - donutteam-game-lua-readme
        - dt-docs-all-objectives
      detail: >-
        Used verbatim in Game.lua's own README example as
        Game.AddObjective("dummy"). This is the only objective this toolkit
        emits with no unverified parameters, which makes it the correct choice
        for compiler fixtures.
    notes:
      - 'A placeholder objective that does not itself define a goal. Useful for proving a mission script compiles and closes its scopes correctly.'

  - id: goto
    displayName: goto
    gameCode: goto
    category: base-game
    providedBy: base-game
    verificationStatus: verified
    verifiedAt: '2026-08-05'
    compilerSupport: partial
    parameters: []
    tags: [objective, movement]
    provenance:
      sources:
        - dt-docs-all-objectives
      detail: 'Listed in the base-game objective list. The objective''s own page reads "TODO".'
    notes:
      - 'Name verified; parameters undocumented upstream. The compiler can emit the objective but requires a VERIFIED destination locator, which is why campaigns referencing unverified places fail to build.'

  - id: talkto
    displayName: talkto
    gameCode: talkto
    category: base-game
    providedBy: base-game
    verificationStatus: verified
    verifiedAt: '2026-08-05'
    compilerSupport: partial
    parameters:
      - name: character
        description: 'NPC placed via AddNPC(name, locator).'
        required: true
      - name: locator
        description: 'Type 3 Locator the NPC is placed at.'
        required: true
    tags: [objective, dialogue]
    provenance:
      sources:
        - dt-docs-talkto
        - dt-docs-all-objectives
      detail: >-
        The talkto page is one of the few with a worked example, showing
        AddNPC, AddObjectiveNPCWaypoint and SetTalkToTarget usage.
    notes:
      - 'Requires the player to interact with an NPC marked by an exclamation mark. SetTalkToTarget''s first argument selects the drawable (0 = exclamation mark, 1 = "gift", 2 = "interior_icon") and the second is a height offset.'

