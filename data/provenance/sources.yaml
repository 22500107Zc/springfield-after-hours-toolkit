    path: src/Game.lua
    retrievedAt: '2026-08-05'
    license: MIT
    notes: >-
      The DefaultCommands, ASFCommands and DebugTestCommands tables inside this
      file are the source of every command record's MinArgs, MaxArgs,
      RequiresScope, OpensScope, ClosesScope and Conditional value. This
      repository derives metadata from that file; it does not vendor it.

